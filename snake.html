<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 RETRO SNAKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(0,255,136,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
  }

  .title {
    font-size: 1.4rem;
    margin-bottom: 14px;
    text-shadow: 0 0 16px #ff6b9d, 0 0 48px #ff6b9d;
    letter-spacing: 4px;
    animation: glow 3s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 16px #ff6b9d, 0 0 48px #ff6b9d; }
    to   { text-shadow: 0 0 16px #6bffc8, 0 0 48px #6bffc8; }
  }

  .hud {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    font-size: 0.65rem;
  }
  .hud span {
    padding: 6px 14px;
    border: 2px solid rgba(130,200,255,0.5);
    border-radius: 6px;
    background: rgba(30,30,80,0.6);
    text-shadow: 0 0 8px rgba(130,200,255,0.6);
  }
  .hud .score-val { color: #ffe066; }
  .hud .high-val  { color: #ff88cc; }

  .game-wrap {
    position: relative;
    border: 3px solid rgba(130,200,255,0.4);
    border-radius: 12px;
    box-shadow:
      0 0 30px rgba(100,150,255,0.2),
      inset 0 0 40px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  canvas {
    display: block;
    background: #0e0e2a;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,5,25,0.82);
    backdrop-filter: blur(6px);
    z-index: 10;
    gap: 18px;
  }
  .overlay.hidden { display: none; }

  .overlay h2 {
    font-size: 1.3rem;
    text-shadow: 0 0 24px #ff88cc;
    animation: pulse 0.9s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    from { transform: scale(1); }
    to   { transform: scale(1.06); }
  }

  .overlay p {
    font-size: 0.52rem;
    line-height: 2.2;
    color: #aab;
  }
  .overlay p b { color: #8cf; }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem;
    padding: 12px 32px;
    border: 2px solid #6bf;
    background: rgba(80,150,255,0.15);
    color: #8cf;
    border-radius: 8px;
    cursor: pointer;
    transition: all .25s;
  }
  .btn:hover {
    background: rgba(80,150,255,0.35);
    box-shadow: 0 0 24px rgba(80,150,255,0.5);
  }

  .controls-hint {
    margin-top: 14px;
    font-size: 0.42rem;
    color: #556;
    text-align: center;
    line-height: 2;
  }

  .mobile-controls {
    display: none;
    margin-top: 14px;
    gap: 8px;
  }
  .mobile-controls button {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.1rem;
    width: 58px; height: 58px;
    border: 2px solid rgba(130,200,255,0.4);
    background: rgba(30,30,80,0.6);
    color: #8cf;
    border-radius: 10px;
    cursor: pointer;
  }
  .mobile-controls button:active { background: rgba(80,150,255,0.35); }
  .mc-row { display: flex; gap: 8px; justify-content: center; }

  @media (pointer: coarse) {
    .mobile-controls { display: grid; }
    .controls-hint { display: none; }
  }

  .speed-bar {
    position: absolute;
    top: 8px; right: 12px;
    font-size: 0.38rem;
    color: #ffe066;
    text-shadow: 0 0 8px rgba(255,224,102,0.5);
    z-index: 5;
  }
</style>
</head>
<body>

<div class="title">🐍 SNAKE</div>

<div class="hud">
  <span>SCORE <b class="score-val" id="score">0</b></span>
  <span>HIGH <b class="high-val" id="high">0</b></span>
</div>

<div class="game-wrap">
  <canvas id="game" width="480" height="480"></canvas>
  <div class="speed-bar" id="speed-label">SPD 1</div>

  <div class="overlay" id="overlay-start">
    <h2>READY?</h2>
    <p>
      <b>↑↓←→</b> or <b>WASD</b> to move<br>
      <b>SPACE</b> to pause &nbsp; <b>M</b> to mute<br>
      <b style="color:#f66">⚠️ Hitting the walls = game over!</b>
    </p>
    <button class="btn" id="btn-start">START</button>
  </div>

  <div class="overlay hidden" id="overlay-over">
    <h2>GAME OVER</h2>
    <p id="final-score">SCORE: 0</p>
    <button class="btn" id="btn-restart">RESTART</button>
  </div>

  <div class="overlay hidden" id="overlay-pause">
    <h2>PAUSED</h2>
    <p>press <b>SPACE</b> to resume</p>
  </div>
</div>

<div class="controls-hint">
  ↑↓←→ / WASD move &nbsp;|&nbsp; SPACE pause &nbsp;|&nbsp; M mute &nbsp;|&nbsp; ⚠️ walls kill!
</div>

<div class="mobile-controls">
  <div class="mc-row"><button data-dir="up">▲</button></div>
  <div class="mc-row">
    <button data-dir="left">◀</button>
    <button data-dir="right">▶</button>
  </div>
  <div class="mc-row"><button data-dir="down">▼</button></div>
</div>

<script>
/* ═══════════ CONFIG ═══════════ */
const COLS = 20, ROWS = 20;
const CELL = 24;
const BASE_SPEED = 130;
const MIN_SPEED  = 55;
const SPEED_STEP = 8;
const LEVEL_EVERY = 5;

/* ═══════════ DOM ═══════════ */
const cvs   = document.getElementById('game');
const ctx   = cvs.getContext('2d');
const elScore  = document.getElementById('score');
const elHigh   = document.getElementById('high');
const elSpeed  = document.getElementById('speed-label');
const ovStart  = document.getElementById('overlay-start');
const ovOver   = document.getElementById('overlay-over');
const ovPause  = document.getElementById('overlay-pause');
const elFinal  = document.getElementById('final-score');

/* ═══════════ AUDIO ═══════════ */
let audioCtx = null;
let muted = false;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playBeep(freq, dur, type = 'square', vol = 0.15) {
  if (muted || !audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}

const sfx = {
  eat()     { playBeep(880, 0.07, 'square', 0.16); setTimeout(() => playBeep(1320, 0.09, 'square', 0.11), 55); },
  die()     { playBeep(220, 0.35, 'sawtooth', 0.2); setTimeout(() => playBeep(110, 0.5, 'sawtooth', 0.15), 160); },
  levelUp() { [660,880,1100,1320].forEach((f,i) => setTimeout(() => playBeep(f,0.12,'triangle',0.12), i*80)); },
};

/* ═══════════ STATE ═══════════ */
let snake, prevSnake, dir, nextDir, food, score, high, speed, level, paused, running, foodCount;
let foodPulse = 0;
let lastTick = 0;
let animTime = 0;

function resetState() {
  const mid = Math.floor(COLS / 2);
  snake = [
    { x: mid, y: mid },
    { x: mid - 1, y: mid },
    { x: mid - 2, y: mid },
    { x: mid - 3, y: mid },
  ];
  prevSnake = snake.map(s => ({ ...s }));
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  foodCount = 0;
  level = 1;
  speed = BASE_SPEED;
  paused = false;
  running = true;
  foodPulse = 0;
  elScore.textContent = '0';
  elSpeed.textContent = 'SPD 1';
  spawnFood();
}

function spawnFood() {
  let fx, fy, ok;
  do {
    fx = Math.floor(Math.random() * COLS);
    fy = Math.floor(Math.random() * ROWS);
    ok = !snake.some(s => s.x === fx && s.y === fy);
  } while (!ok);
  food = { x: fx, y: fy };
}

/* ═══════════ DRAWING ═══════════ */
function lerp(a, b, t) { return a + (b - a) * t; }

function drawBackground() {
  ctx.fillStyle = '#0e0e2a';
  ctx.fillRect(0, 0, cvs.width, cvs.height);

  // soft grid
  ctx.strokeStyle = 'rgba(80,120,200,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, cvs.height); ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(cvs.width, i * CELL); ctx.stroke();
  }

  // subtle vignette
  const vg = ctx.createRadialGradient(cvs.width/2, cvs.height/2, cvs.width*0.3, cvs.width/2, cvs.height/2, cvs.width*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, cvs.width, cvs.height);
}

function drawFood(t) {
  const fx = food.x * CELL + CELL / 2;
  const fy = food.y * CELL + CELL / 2;
  foodPulse += 0.04;
  const pulse = 1 + Math.sin(foodPulse) * 0.12;
  const r = CELL * 0.38 * pulse;

  // outer glow
  const glow = ctx.createRadialGradient(fx, fy, r * 0.3, fx, fy, r * 2.2);
  glow.addColorStop(0, 'rgba(255,80,100,0.5)');
  glow.addColorStop(0.5, 'rgba(255,50,80,0.15)');
  glow.addColorStop(1, 'rgba(255,0,50,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(fx, fy, r * 2.2, 0, Math.PI * 2);
  ctx.fill();

  // apple body
  const bodyGrad = ctx.createRadialGradient(fx - r*0.3, fy - r*0.3, r*0.1, fx, fy, r);
  bodyGrad.addColorStop(0, '#ff8899');
  bodyGrad.addColorStop(0.6, '#ff3355');
  bodyGrad.addColorStop(1, '#cc1133');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.arc(fx, fy, r, 0, Math.PI * 2);
  ctx.fill();

  // glossy highlight
  const gloss = ctx.createRadialGradient(fx - r*0.35, fy - r*0.35, 0, fx - r*0.2, fy - r*0.2, r*0.5);
  gloss.addColorStop(0, 'rgba(255,255,255,0.7)');
  gloss.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gloss;
  ctx.beginPath();
  ctx.arc(fx - r*0.3, fy - r*0.3, r*0.45, 0, Math.PI * 2);
  ctx.fill();

  // leaf
  ctx.fillStyle = '#44cc44';
  ctx.beginPath();
  ctx.ellipse(fx + 2, fy - r - 3, 5, 9, -0.4, 0, Math.PI * 2);
  ctx.fill();
  // stem
  ctx.strokeStyle = '#228833';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(fx, fy - r + 2);
  ctx.quadraticCurveTo(fx + 1, fy - r - 2, fx + 2, fy - r - 4);
  ctx.stroke();
}

function drawSnake(t) {
  // compute interpolated positions
  const interp = snake.map((seg, i) => {
    const prev = prevSnake[i] || seg;
    // handle wrap: if prev is far from current, don't lerp across the whole board
    let px = prev.x, py = prev.y;
    const dx = seg.x - prev.x;
    const dy = seg.y - prev.y;
    if (Math.abs(dx) > 1) px = seg.x; // wrapped
    if (Math.abs(dy) > 1) py = seg.y; // wrapped
    const ix = lerp(px, seg.x, t);
    const iy = lerp(py, seg.y, t);
    return { x: ix * CELL + CELL/2, y: iy * CELL + CELL/2 };
  });

  const n = interp.length;

  // Draw from tail to head so head is on top
  for (let i = n - 1; i >= 0; i--) {
    const pt = interp[i];
    const head = i === 0;
    const frac = i / Math.max(n - 1, 1);

    // Rainbow hue: head starts pink/magenta, body goes through green/cyan
    const hue = head ? 330 : (120 + frac * 120); // 120=green → 240=blue/purple
    const light = head ? 55 : 48 - frac * 12;
    const sat = head ? 80 : 90;

    // Uniform segment size – every circle is the same
    const segSize = CELL * 0.82;

    // Soft shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.arc(pt.x + 2, pt.y + 2, segSize/2, 0, Math.PI * 2);
    ctx.fill();

    // Body gradient
    const grad = ctx.createRadialGradient(
      pt.x - segSize*0.15, pt.y - segSize*0.15, segSize*0.05,
      pt.x, pt.y, segSize*0.55
    );
    grad.addColorStop(0, `hsl(${hue}, ${sat}%, ${light + 18}%)`);
    grad.addColorStop(0.7, `hsl(${hue}, ${sat}%, ${light}%)`);
    grad.addColorStop(1, `hsl(${hue}, ${sat}%, ${light - 12}%)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, segSize/2, 0, Math.PI * 2);
    ctx.fill();

    // Belly highlight (subtle lighter stripe)
    if (!head) {
      ctx.fillStyle = `hsla(${hue + 20}, 70%, ${light + 20}%, 0.25)`;
      ctx.beginPath();
      ctx.ellipse(pt.x, pt.y, segSize*0.3, segSize*0.18, 0, 0, Math.PI*2);
      ctx.fill();
    }

    // ─── CUTE EYES ON HEAD ───
    if (head) {
      drawCuteEyes(pt, segSize, dir);
    }

    // ─── ROSY CHEEKS ON HEAD ───
    if (head) {
      ctx.fillStyle = 'rgba(255,150,180,0.5)';
      // cheeks offset perpendicular to direction
      const cx = dir.y !== 0 ? pt.x - dir.x * segSize*0.2 : pt.x;
      const cy = dir.x !== 0 ? pt.y - dir.y * segSize*0.2 : pt.y;
      const off = segSize * 0.22;
      const px1 = dir.x !== 0 ? cx : pt.x;
      const py1 = dir.y !== 0 ? cy : pt.y;
      // left cheek
      ctx.beginPath();
      ctx.arc(
        dir.x === 1 ? pt.x - off : dir.x === -1 ? pt.x + off : pt.x - off,
        dir.y === 1 ? pt.y + off*0.7 : dir.y === -1 ? pt.y - off*0.7 : pt.y + off*0.7,
        segSize * 0.09, 0, Math.PI*2);
      ctx.fill();
      // right cheek
      ctx.beginPath();
      ctx.arc(
        dir.x === 1 ? pt.x + off : dir.x === -1 ? pt.x - off : pt.x + off,
        dir.y === 1 ? pt.y + off*0.7 : dir.y === -1 ? pt.y - off*0.7 : pt.y - off*0.7,
        segSize * 0.09, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function drawCuteEyes(pt, segSize, d) {
  const eyeR = segSize * 0.26; // large cute eyes
  // eyes positioned on the front of the head based on direction
  let ex1, ey1, ex2, ey2;
  const front = segSize * 0.2;
  const side = segSize * 0.22;

  if (d.x === 1) {  // facing right
    ex1 = pt.x + front; ey1 = pt.y - side;
    ex2 = pt.x + front; ey2 = pt.y + side;
  } else if (d.x === -1) { // facing left
    ex1 = pt.x - front; ey1 = pt.y - side;
    ex2 = pt.x - front; ey2 = pt.y + side;
  } else if (d.y === -1) { // facing up
    ex1 = pt.x - side; ey1 = pt.y - front;
    ex2 = pt.x + side; ey2 = pt.y - front;
  } else { // facing down
    ex1 = pt.x - side; ey1 = pt.y + front;
    ex2 = pt.x + side; ey2 = pt.y + front;
  }

  // Eye whites (large)
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ex1, ey1, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2, ey2, eyeR, 0, Math.PI*2); ctx.fill();

  // Subtle eye outline
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(ex1, ey1, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(ex2, ey2, eyeR, 0, Math.PI*2); ctx.stroke();

  // Iris (dark, slightly toward direction)
  const irisR = eyeR * 0.55;
  const irisOff = eyeR * 0.15;
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(ex1 + d.x * irisOff, ey1 + d.y * irisOff, irisR, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex2 + d.x * irisOff, ey2 + d.y * irisOff, irisR, 0, Math.PI*2);
  ctx.fill();

  // Big sparkle highlight (top-left of iris)
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  const sparkR = irisR * 0.35;
  ctx.beginPath();
  ctx.arc(ex1 + d.x*irisOff - irisR*0.25, ey1 + d.y*irisOff - irisR*0.25, sparkR, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex2 + d.x*irisOff - irisR*0.25, ey2 + d.y*irisOff - irisR*0.25, sparkR, 0, Math.PI*2);
  ctx.fill();

  // Tiny second sparkle
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const spark2R = irisR * 0.18;
  ctx.beginPath();
  ctx.arc(ex1 + d.x*irisOff + irisR*0.2, ey1 + d.y*irisOff + irisR*0.2, spark2R, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex2 + d.x*irisOff + irisR*0.2, ey2 + d.y*irisOff + irisR*0.2, spark2R, 0, Math.PI*2);
  ctx.fill();

  // Little smile (mouth) below eyes
  const mouthY = (ey1 + ey2) / 2 + eyeR * 1.1;
  const mouthX = (ex1 + ex2) / 2;
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(mouthX, mouthY, segSize * 0.08, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.stroke();
}

/* ═══════════ GAME LOOP (with interpolation) ═══════════ */
function tick(now) {
  requestAnimationFrame(tick);

  const elapsed = now - lastTick;
  const t = Math.min(elapsed / speed, 1); // 0→1 interpolation factor

  // Draw with interpolated positions
  drawBackground();
  drawFood(t);
  drawSnake(t);

  if (!running || paused) return;

  if (elapsed < speed) return;

  lastTick = now;

  // Save prev positions before moving
  prevSnake = snake.map(s => ({ ...s }));

  // Apply direction
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision – hitting a wall ends the game
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver();
    return;
  }

  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    foodCount++;
    sfx.eat();
    elScore.textContent = score;
    if (foodCount % LEVEL_EVERY === 0) {
      level++;
      speed = Math.max(MIN_SPEED, BASE_SPEED - (level - 1) * SPEED_STEP);
      elSpeed.textContent = 'SPD ' + level;
      sfx.levelUp();
    }
    spawnFood();
  } else {
    snake.pop();
  }

  // Sync prevSnake length
  while (prevSnake.length < snake.length) {
    prevSnake.push({ x: snake[prevSnake.length].x, y: snake[prevSnake.length].y });
  }
  prevSnake.length = snake.length;
}

function startGame() {
  initAudio();
  resetState();
  ovStart.classList.add('hidden');
  ovOver.classList.add('hidden');
  ovPause.classList.add('hidden');
  running = true;
  lastTick = performance.now();
}

function gameOver() {
  running = false;
  sfx.die();
  if (score > high) { high = score; elHigh.textContent = high; }
  elFinal.textContent = `SCORE: ${score}`;
  ovOver.classList.remove('hidden');
  // red flash
  ctx.fillStyle = 'rgba(255,0,50,0.18)';
  ctx.fillRect(0, 0, cvs.width, cvs.height);
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  if (paused) {
    ovPause.classList.remove('hidden');
  } else {
    ovPause.classList.add('hidden');
    lastTick = performance.now();
  }
}

/* ═══════════ INPUT ═══════════ */
const KEY_MAP = {
  ArrowUp:    { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
  ArrowDown:  { x: 0, y: 1 },  KeyS: { x: 0, y: 1 },
  ArrowLeft:  { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 },  KeyD: { x: 1, y: 0 },
};

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); return; }
  if (e.code === 'KeyM')  { muted = !muted; return; }
  const d = KEY_MAP[e.code];
  if (!d) return;
  e.preventDefault();
  if (d.x === -dir.x && d.y === -dir.y && snake.length > 1) return;
  nextDir = d;
});

document.querySelectorAll('.mobile-controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    const dirs = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    const d = dirs[btn.dataset.dir];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y && snake.length > 1) return;
    nextDir = d;
  });
});

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

/* ═══════════ INIT ═══════════ */
high = parseInt(localStorage.getItem('retroSnakeHigh') || '0');
elHigh.textContent = high;
resetState();

// Save high score
const origGameOver = gameOver;
gameOver = function() {
  localStorage.setItem('retroSnakeHigh', high);
  origGameOver();
};

requestAnimationFrame(tick);
</script>
</body>
</html>
